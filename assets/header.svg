<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#accentGrad);
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #94a3b8;
    }
    .dot {
      fill: #38bdf8;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #64748b;
    }
    .code-symbol {
      font-family: 'SF Mono', Monaco, 'Courier New', monospace;
      font-weight: 700;
      fill: #38bdf8;
    }
    
    /* Subtle pulsing waves */
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    .pulsing-glow {
      animation: pulse 4s ease-in-out infinite;
    }

    /* Animated text rotator */
    @keyframes textCycle1 {
      0%, 22% { opacity: 1; transform: translateY(0); }
      25%, 97% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes textCycle2 {
      0%, 23% { opacity: 0; transform: translateY(8px); }
      26%, 47% { opacity: 1; transform: translateY(0); }
      50%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes textCycle3 {
      0%, 48% { opacity: 0; transform: translateY(8px); }
      51%, 72% { opacity: 1; transform: translateY(0); }
      75%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes textCycle4 {
      0%, 73% { opacity: 0; transform: translateY(8px); }
      76%, 97% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(8px); }
    }
    .role-1 { animation: textCycle1 12s infinite; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 500; fill: #38bdf8; }
    .role-2 { animation: textCycle2 12s infinite; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 500; fill: #818cf8; }
    .role-3 { animation: textCycle3 12s infinite; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 500; fill: #c084fc; }
    .role-4 { animation: textCycle4 12s infinite; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 500; fill: #34d399; }
  </style>

  <!-- Outer Card Background -->
  <rect x="2" y="2" width="946" height="276" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="60" r="140" fill="url(#glowGrad)" class="pulsing-glow" />
  <circle cx="820" cy="220" r="160" fill="url(#glowGrad)" class="pulsing-glow" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="40" x2="910" y2="40" />
    <line x1="40" y1="100" x2="910" y2="100" />
    <line x1="40" y1="160" x2="910" y2="160" />
    <line x1="40" y1="220" x2="910" y2="220" />
    <line x1="100" y1="20" x2="100" y2="260" />
    <line x1="250" y1="20" x2="250" y2="260" />
    <line x1="400" y1="20" x2="400" y2="260" />
    <line x1="550" y1="20" x2="550" y2="260" />
    <line x1="700" y1="20" x2="700" y2="260" />
    <line x1="850" y1="20" x2="850" y2="260" />
  </g>

  <!-- Left Icon Emblem (Glowing Hex / Terminal) -->
  <g transform="translate(50, 48)">
    <rect x="0" y="0" width="84" height="84" rx="20" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
    <!-- Gradient Inner Ring -->
    <circle cx="42" cy="42" r="30" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="5 3" />
    <!-- Center Code Icon -->
    <text x="42" y="49" text-anchor="middle" font-size="28" class="code-symbol">&lt;/&gt;</text>
  </g>

  <!-- Header Main Content -->
  <g transform="translate(156, 75)">
    <!-- Greeting Subtext -->
    <text x="0" y="0" font-family="'SF Mono', Monaco, monospace" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
      // HELLO WORLD, I'M
    </text>
    
    <!-- Main Name -->
    <text x="0" y="38" class="title-text">Rahul Kumar</text>
    
    <!-- Animated Role Display -->
    <g transform="translate(0, 68)">
      <circle cx="5" cy="-5" r="4" class="dot" />
      <text x="18" y="0" class="role-1">💻 Computer Engineering Student @ Marwadi University</text>
      <text x="18" y="0" class="role-2">⚡ Full-Stack Developer • MERN &amp; .NET Architecture</text>
      <text x="18" y="0" class="role-3">📊 Data Science, Machine Learning &amp; Agentic AI</text>
      <text x="18" y="0" class="role-4">🚀 Open Source Contributor &amp; AI Builder</text>
    </g>
  </g>

  <!-- Location & Status Badge (Top Right) -->
  <g transform="translate(680, 42)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="17" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
      Rajkot, Gujarat, India 🇮🇳
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="195" x2="900" y2="195" stroke="#1e293b" stroke-width="1" />

  <!-- Bottom Tech Pills Bar -->
  <g transform="translate(50, 215)">
    <!-- Pill 1: C# & .NET -->
    <g transform="translate(0, 0)">
      <rect width="112" height="32" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="56" y="20" text-anchor="middle" class="badge-text">⚡ C# / .NET</text>
    </g>

    <!-- Pill 2: React -->
    <g transform="translate(122, 0)">
      <rect width="100" height="32" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="50" y="20" text-anchor="middle" class="badge-text">⚛️ React</text>
    </g>

    <!-- Pill 3: Node.js -->
    <g transform="translate(232, 0)">
      <rect width="105" height="32" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="52" y="20" text-anchor="middle" class="badge-text">🟢 Node.js</text>
    </g>

    <!-- Pill 4: Python -->
    <g transform="translate(347, 0)">
      <rect width="105" height="32" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="52" y="20" text-anchor="middle" class="badge-text">🐍 Python</text>
    </g>

    <!-- Pill 5: MongoDB -->
    <g transform="translate(462, 0)">
      <rect width="115" height="32" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="57" y="20" text-anchor="middle" class="badge-text">🍃 MongoDB</text>
    </g>

    <!-- Pill 6: MySQL -->
    <g transform="translate(587, 0)">
      <rect width="100" height="32" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1" />
      <text x="50" y="20" text-anchor="middle" class="badge-text">🐬 MySQL</text>
    </g>

    <!-- Pill 7: AI/ML -->
    <g transform="translate(697, 0)">
      <rect width="153" height="32" rx="8" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" />
      <text x="76" y="20" text-anchor="middle" class="badge-text" fill="#38bdf8">🤖 AI &amp; Data Science</text>
    </g>
  </g>
</svg>
